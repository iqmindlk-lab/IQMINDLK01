<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ MIND PRO - IQ බුද්ධි පරික්ශන</title>

        <script>
      (function() {
        const userSession = sessionStorage.getItem("iq_user_id");
        // session එකක් නැත්නම් කෙලින්ම index.html එකට යවන්න
        if (!userSession) {
          window.location.href = "proiqmind.html";
        }
      })();
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08041f;
            --card: #100b2e;
            --purple: #a855f7;
            --purple-dark: #7c3aed;
            --purple-light: #c084fc;
            --gold: #f59e0b;
            --gold-light: #fcd34d;
            --teal: #06b6d4;
            --red: #f43f5e;
            --green: #10b981;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.55);
            --border: rgba(168,85,247,0.18);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 10% 15%, rgba(168,85,247,0.13) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 85%, rgba(245,158,11,0.09) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 40%, rgba(6,182,212,0.07) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,4,31,0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            color: var(--muted); font-size: 13px; font-weight: 600;
            text-decoration: none;
            background: rgba(168,85,247,0.10);
            border-radius: 8px; padding: 7px 12px;
            transition: 0.2s; border: none; cursor: pointer;
        }
        .back-btn:hover { color: #fff; background: rgba(168,85,247,0.22); }

        .timer-box {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 12px; padding: 8px 16px;
            font-size: 18px; font-weight: 900; letter-spacing: 1px;
            box-shadow: 0 4px 18px rgba(168,85,247,0.45);
        }
        .timer-box.warning { animation: timerPulse 0.8s ease-in-out infinite; }
        @keyframes timerPulse {
            0%, 100% { box-shadow: 0 4px 18px rgba(168,85,247,0.45); }
            50% { box-shadow: 0 4px 32px rgba(168,85,247,0.90); }
        }

        .progress-info {
            font-size: 12px; color: var(--muted); font-weight: 600;
            text-align: right; line-height: 1.3;
        }
        .progress-info strong { color: var(--purple-light); font-size: 14px; }

        .progress-wrap {
            height: 4px; background: rgba(168,85,247,0.12);
            position: sticky; top: 57px; z-index: 99;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple-dark), var(--gold));
            transition: width 0.4s ease;
        }

        /* ===== QUIZ CONTENT ===== */
        .quiz-content { padding: 20px 16px 40px; max-width: 640px; margin: 0 auto; }

        .question-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 20px 18px;
            margin-bottom: 14px;
            position: relative;
            transition: border-color 0.3s;
        }
        .question-card.answered-correct { border-color: rgba(16,185,129,0.5); }
        .question-card.answered-wrong { border-color: rgba(244,63,94,0.4); }

        .q-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(168,85,247,0.15);
            border: 1px solid rgba(168,85,247,0.30);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px; font-weight: 700;
            color: var(--purple-light);
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }
        .q-badge i { font-size: 10px; }

        .question-text {
            font-size: 15px; font-weight: 700;
            line-height: 1.70; color: #fff;
            margin-bottom: 16px;
        }
        .options-grid { display: flex; flex-direction: column; gap: 9px; }

        .option-label {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 16px;
            border-radius: 13px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(168,85,247,0.14);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .option-label:hover {
            background: rgba(168,85,247,0.12);
            border-color: rgba(168,85,247,0.45);
        }
        .option-label input[type="radio"] { display: none; }

        .option-letter {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: rgba(168,85,247,0.10);
            border: 1.5px solid rgba(168,85,247,0.22);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: var(--muted);
            flex-shrink: 0; transition: all 0.2s;
        }
        .option-text {
            font-size: 14px; font-weight: 600;
            color: rgba(255,255,255,0.85); line-height: 1.45;
        }
        .option-label.selected {
            background: rgba(168,85,247,0.18);
            border-color: var(--purple);
        }
        .option-label.selected .option-letter {
            background: var(--purple); border-color: var(--purple); color: #fff;
        }
        .option-label.selected .option-text { color: #fff; }
        .option-label.show-correct {
            background: rgba(16,185,129,0.13); border-color: var(--green);
        }
        .option-label.show-correct .option-letter {
            background: var(--green); border-color: var(--green); color: #fff;
        }
        .option-label.show-wrong {
            background: rgba(244,63,94,0.13); border-color: var(--red);
        }
        .option-label.show-wrong .option-letter {
            background: var(--red); border-color: var(--red); color: #fff;
        }

        /* ===== SUBMIT BAR ===== */
        .submit-bar {
            position: sticky; bottom: 0;
            background: rgba(8,4,31,0.97);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            padding: 16px;
            display: flex; gap: 10px; align-items: center;
        }
        .answered-count {
            font-size: 12px; color: var(--muted); font-weight: 600;
            flex: 1; line-height: 1.4;
        }
        .answered-count strong { color: var(--gold); }
        .submit-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            border: none; border-radius: 14px; color: #fff;
            font-size: 15px; font-weight: 900; cursor: pointer;
            box-shadow: 0 6px 22px rgba(168,85,247,0.45);
            transition: 0.2s; font-family: 'Poppins', sans-serif;
        }
        .submit-btn:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(168,85,247,0.62); }

        /* ===== RESULT SCREEN ===== */
        #resultScreen { padding: 24px 16px 60px; max-width: 640px; margin: 0 auto; }

        .result-header {
            background: linear-gradient(135deg, #3b1f7a 0%, #1e0a4a 100%);
            border: 1px solid rgba(168,85,247,0.35);
            border-radius: 24px;
            padding: 30px 24px 28px;
            text-align: center; margin-bottom: 20px;
            box-shadow: 0 12px 48px rgba(168,85,247,0.28);
            position: relative; overflow: hidden;
        }
        .result-header::before {
            content: '';
            position: absolute; top: -50px; left: -50px;
            width: 150px; height: 150px;
            border-radius: 50%;
            background: rgba(168,85,247,0.10);
        }
        .result-header::after {
            content: '';
            position: absolute; bottom: -40px; right: -40px;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(245,158,11,0.08);
        }

        .result-emoji { font-size: 52px; display: block; margin-bottom: 8px; position: relative; z-index: 1; }
        .result-iq-number {
            font-size: 72px; font-weight: 900; line-height: 1;
            color: #fff;
            text-shadow: 0 0 32px rgba(168,85,247,0.6), 0 4px 16px rgba(0,0,0,0.4);
            position: relative; z-index: 1;
        }
        .result-iq-label {
            font-size: 13px; color: rgba(255,255,255,0.65);
            font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            margin-top: 4px; position: relative; z-index: 1;
        }
        .result-grade-badge {
            display: inline-block; margin-top: 14px;
            background: linear-gradient(135deg, var(--gold), #d97706);
            border-radius: 20px; padding: 7px 22px;
            font-size: 15px; font-weight: 900; letter-spacing: 0.5px;
            color: #fff;
            box-shadow: 0 4px 14px rgba(245,158,11,0.40);
            position: relative; z-index: 1;
        }
        .result-label {
            font-size: 13px; color: rgba(255,255,255,0.72);
            font-weight: 500; margin-top: 8px;
            position: relative; z-index: 1;
        }

        /* ===== IQ METER ===== */
        .iq-meter-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 20px 18px;
            margin-bottom: 20px;
            text-align: center;
        }
        .iq-meter-title {
            font-size: 12px; font-weight: 700;
            color: var(--purple-light); letter-spacing: 1.2px;
            text-transform: uppercase; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        /* SVG Gauge */
        .gauge-svg-wrap { position: relative; display: inline-block; }
        .gauge-svg-wrap svg { display: block; }
        .gauge-center-text {
            position: absolute;
            top: 58%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .gauge-iq-val {
            font-size: 30px; font-weight: 900; color: #fff;
            line-height: 1;
            text-shadow: 0 0 16px rgba(168,85,247,0.5);
        }
        .gauge-iq-sub {
            font-size: 11px; font-weight: 700;
            color: var(--muted); letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* IQ Scale labels */
        .iq-scale-labels {
            display: flex; justify-content: space-between;
            margin-top: 10px; padding: 0 6px;
        }
        .iq-scale-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .iq-scale-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }
        .iq-scale-text { font-size: 9px; font-weight: 700; color: var(--muted); }

        /* IQ Band bar */
        .iq-band-bar {
            display: flex; border-radius: 10px; overflow: hidden;
            height: 10px; margin: 14px 0 6px; gap: 2px;
        }
        .iq-band-seg {
            flex: 1; border-radius: 4px;
            position: relative; transition: transform 0.3s;
        }
        .iq-band-seg.active-seg {
            transform: scaleY(1.5);
            transform-origin: center;
            border-radius: 4px;
        }
        .iq-band-labels {
            display: flex; justify-content: space-between;
            font-size: 9px; font-weight: 600; color: var(--muted);
            padding: 0 2px; margin-bottom: 4px;
        }
        .active-band-label {
            font-size: 12px; font-weight: 800;
            text-align: center; margin-top: 6px;
            padding: 5px 16px; border-radius: 20px;
            display: inline-block;
        }

        /* ===== STATS ROW ===== */
        .stats-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 16px 12px; text-align: center;
        }
        .stat-icon { font-size: 22px; margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 900; }
        .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
        .stat-card.correct .stat-value { color: var(--green); }
        .stat-card.wrong .stat-value { color: var(--red); }
        .stat-card.skipped .stat-value { color: var(--gold); }

        /* ===== ACTION BUTTONS ===== */
        .action-btns { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .action-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.22s;
            font-family: 'Poppins', sans-serif; text-decoration: none; color: #fff;
        }
        .action-btn.review-btn {
            background: linear-gradient(135deg, var(--gold), #d97706);
            box-shadow: 0 8px 24px rgba(245,158,11,0.38);
        }
        .action-btn.retry-btn {
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            box-shadow: 0 8px 24px rgba(168,85,247,0.38);
        }
        .action-btn:hover { transform: translateY(-3px) scale(1.02); }

        /* ===== REVIEW SECTION ===== */
        .review-section { display: none; }
        .review-section.open { display: block; }
        .review-title {
            font-size: 16px; font-weight: 900;
            color: var(--purple-light); margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .review-card {
            background: var(--card);
            border: 1px solid rgba(168,85,247,0.22);
            border-radius: 16px; padding: 18px 16px; margin-bottom: 12px;
        }
        .review-q {
            font-size: 14px; font-weight: 700; color: #fff;
            margin-bottom: 10px; line-height: 1.55;
        }
        .review-row {
            display: flex; align-items: flex-start; gap: 8px;
            font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.45;
        }
        .review-tag {
            font-size: 10px; font-weight: 800;
            padding: 2px 8px; border-radius: 6px;
            white-space: nowrap; margin-top: 1px;
        }
        .tag-wrong { background: rgba(244,63,94,0.20); color: var(--red); }
        .tag-correct { background: rgba(16,185,129,0.20); color: var(--green); }
        .tag-skipped { background: rgba(245,158,11,0.20); color: var(--gold); }

        /* Pulse ring on timer warning */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        #resultScreen { animation: fadeUp 0.5s ease; }
    </style>
</head>
<body>

<!-- ========== QUIZ SCREEN ========== -->
<div id="quizScreen" class="screen active">
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ආපසු</a>
        <div class="timer-box" id="timerBox">
            <i class="fas fa-brain"></i>
            <span id="timerDisplay">30:00</span>
        </div>
        <div class="progress-info">
            <strong id="answeredCount">0</strong>/20<br>
            <span>answered</span>
        </div>
    </div>
    <div class="progress-wrap">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="quiz-content" id="quizContent"></div>
    <div class="submit-bar">
        <div class="answered-count">
            <strong id="answeredCountBottom">0</strong> ප්‍රශ්නවලට<br>
            <span>පිළිතුරු දී ඇත</span>
        </div>
        <button class="submit-btn" onclick="submitQuiz()">
            <i class="fas fa-paper-plane"></i> ඉදිරිපත් කරන්න
        </button>
    </div>
</div>

<!-- ========== RESULT SCREEN ========== -->
<div id="resultScreen" class="screen">
    <div class="result-header">
        <span class="result-emoji" id="resultEmoji">🧠</span>
        <div class="result-iq-number" id="resultIQ">100</div>
        <div class="result-iq-label">ඔබේ IQ මට්ටම</div>
        <div class="result-grade-badge" id="resultGrade">සාමාන්‍ය</div>
        <div class="result-label" id="resultLabel"></div>
    </div>

    <!-- IQ Meter -->
    <div class="iq-meter-wrap">
        <div class="iq-meter-title"><i class="fas fa-tachometer-alt"></i> IQ මිටරය</div>

        <!-- SVG Gauge -->
        <div class="gauge-svg-wrap">
            <svg id="gaugeSvg" width="260" height="148" viewBox="0 0 260 148">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%"   stop-color="#f43f5e"/>
                        <stop offset="25%"  stop-color="#f59e0b"/>
                        <stop offset="50%"  stop-color="#10b981"/>
                        <stop offset="75%"  stop-color="#06b6d4"/>
                        <stop offset="100%" stop-color="#a855f7"/>
                    </linearGradient>
                </defs>
                <!-- Track -->
                <path id="gaugeTrack"  fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18" stroke-linecap="round"/>
                <!-- Fill -->
                <path id="gaugeFill"   fill="none" stroke="url(#gaugeGrad)"        stroke-width="18" stroke-linecap="round"/>
                <!-- Needle -->
                <line id="gaugeNeedle" x1="130" y1="130" x2="130" y2="52"
                      stroke="#fff" stroke-width="3" stroke-linecap="round"
                      style="transform-origin:130px 130px; transform:rotate(0deg); transition:transform 1.2s cubic-bezier(.34,1.56,.64,1)"/>
                <circle cx="130" cy="130" r="7" fill="#fff" opacity="0.9"/>
                <circle cx="130" cy="130" r="3" fill="var(--purple)"/>

                <!-- Scale ticks -->
                <g id="gaugeTicks" fill="rgba(255,255,255,0.4)"></g>
            </svg>
            <div class="gauge-center-text">
                <div class="gauge-iq-val" id="gaugeVal">—</div>
                <div class="gauge-iq-sub">IQ Score</div>
            </div>
        </div>

        <!-- IQ Band Bar -->
        <div class="iq-band-bar">
            <div class="iq-band-seg" style="background:#f43f5e;" data-band="0"></div>
            <div class="iq-band-seg" style="background:#f97316;" data-band="1"></div>
            <div class="iq-band-seg" style="background:#f59e0b;" data-band="2"></div>
            <div class="iq-band-seg" style="background:#10b981;" data-band="3"></div>
            <div class="iq-band-seg" style="background:#06b6d4;" data-band="4"></div>
            <div class="iq-band-seg" style="background:#a855f7;" data-band="5"></div>
        </div>
        <div class="iq-band-labels">
            <span>&lt;70</span>
            <span>70-84</span>
            <span>85-99</span>
            <span>100-114</span>
            <span>115-129</span>
            <span>130+</span>
        </div>
        <div style="text-align:center;">
            <span class="active-band-label" id="bandLabel">—</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card correct">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="correctCount">0</div>
            <div class="stat-label">නිවැරදි</div>
        </div>
        <div class="stat-card wrong">
            <div class="stat-icon">❌</div>
            <div class="stat-value" id="wrongCount">0</div>
            <div class="stat-label">වැරදි</div>
        </div>
        <div class="stat-card skipped">
            <div class="stat-icon">⏭️</div>
            <div class="stat-value" id="skippedCount">0</div>
            <div class="stat-label">skip</div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-btns">
        <button class="action-btn review-btn" onclick="toggleReview()">
            <i class="fas fa-list-ul"></i>
            <span id="reviewBtnText">වැරදි ප්‍රශ්න සාරාංශය බලන්න</span>
        </button>
        <button class="action-btn retry-btn" onclick="retryQuiz()">
            <i class="fas fa-redo"></i> තවත් IQ ටෙස්ට් එකක් try කරමු!
        </button>
    </div>

    <div class="review-section" id="reviewSection">
        <div class="review-title"><i class="fas fa-exclamation-triangle"></i> වැරදි / Skip කළ ප්‍රශ්න</div>
        <div id="reviewContent"></div>
    </div>
</div>

<script>
// ============================================================
// IQ QUESTION BANK

function iqBand(iq) {
    if (iq >= 130) return { band: 5, label: "ප්‍රතිභාශාලී (Gifted)", color: "#a855f7" };
    if (iq >= 115) return { band: 4, label: "ඉහළ හැකියාව (Above Average)", color: "#06b6d4" };
    if (iq >= 100) return { band: 3, label: "සාමාන්‍ය ඉහළ (High Average)", color: "#10b981" };
    if (iq >= 85)  return { band: 2, label: "සාමාන්‍ය (Average)", color: "#f59e0b" };
    if (iq >= 70)  return { band: 1, label: "සාමාන්‍යට පහළ (Below Average)", color: "#f97316" };
    return             { band: 0, label: "දුර්වල (Low)", color: "#f43f5e" };
}
function iqEmoji(iq) {
    if (iq >= 130) return "🏆";
    if (iq >= 115) return "🌟";
    if (iq >= 100) return "🎯";
    if (iq >= 85)  return "👍";
    if (iq >= 70)  return "📚";
    return "💪";
}

let currentQuestions = [];
let userAnswers = {};
let timerInterval = null;
let secondsLeft = TIMER_MINUTES * 60;
let quizSubmitted = false;

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function loadQuiz() {
    userAnswers = {};
    quizSubmitted = false;
    secondsLeft = TIMER_MINUTES * 60;
    updateTimerDisplay();
    document.getElementById('timerBox').classList.remove('warning');

    const pool = shuffle(QUESTION_BANK);
    currentQuestions = pool.slice(0, Math.min(QUESTIONS_PER_TEST, pool.length));

    renderQuestions();
    startTimer();
    updateAnsweredCount();
    window.scrollTo(0, 0);

    document.getElementById('quizScreen').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('quizScreen').classList.add('active');
    document.getElementById('resultScreen').classList.remove('active');
}

const catIcons = {
    Pattern: "fas fa-shapes",
    Logic: "fas fa-lightbulb",
    Number: "fas fa-hashtag",
    Verbal: "fas fa-language",
    Spatial: "fas fa-cube",
    Math: "fas fa-calculator"
};

function renderQuestions() {
    const container = document.getElementById('quizContent');
    container.innerHTML = '';
    const letters = ['A','B','C','D'];

    currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `qcard-${idx}`;
        const icon = catIcons[q.cat] || "fas fa-brain";
        const optionsHTML = q.o.map((opt, oi) => `
            <label class="option-label" id="opt-${idx}-${oi}" onclick="selectAnswer(${idx},${oi})">
                <input type="radio" name="q${idx}" value="${oi}">
                <span class="option-letter">${letters[oi]}</span>
                <span class="option-text">${opt}</span>
            </label>
        `).join('');
        card.innerHTML = `
            <div class="q-badge">
                <i class="${icon}"></i>
                ප්‍රශ්නය ${idx+1} / ${currentQuestions.length} &nbsp;·&nbsp; ${q.cat}
            </div>
            <div class="question-text">${q.q}</div>
            <div class="options-grid">${optionsHTML}</div>
        `;
        container.appendChild(card);
    });
}

function selectAnswer(qIdx, optIdx) {
    if (quizSubmitted) return;
    for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`opt-${qIdx}-${i}`);
        if (el) el.classList.remove('selected');
    }
    const sel = document.getElementById(`opt-${qIdx}-${optIdx}`);
    if (sel) sel.classList.add('selected');
    userAnswers[qIdx] = optIdx;
    updateAnsweredCount();
}

function updateAnsweredCount() {
    const count = Object.keys(userAnswers).length;
    document.getElementById('answeredCount').textContent = count;
    document.getElementById('answeredCountBottom').textContent = count;
    const pct = (count / currentQuestions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 180) document.getElementById('timerBox').classList.add('warning');
        if (secondsLeft <= 0) { clearInterval(timerInterval); submitQuiz(true); }
    }, 1000);
}

function updateTimerDisplay() {
    const m = Math.floor(secondsLeft / 60).toString().padStart(2,'0');
    const s = (secondsLeft % 60).toString().padStart(2,'0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

function submitQuiz(timeUp = false) {
    if (quizSubmitted) return;
    quizSubmitted = true;
    clearInterval(timerInterval);

    let correct = 0, wrong = 0, skipped = 0;
    const wrongItems = [];

    currentQuestions.forEach((q, idx) => {
        const answered = userAnswers[idx] !== undefined;
        if (!answered) {
            skipped++;
        } else if (userAnswers[idx] === q.a) {
            correct++;
        } else {
            wrong++;
            wrongItems.push({ idx, q, userAns: userAnswers[idx] });
        }
    });

    const pct = Math.round((correct / currentQuestions.length) * 100);
    const iq = calcIQ(pct);
    const band = iqBand(iq);
    const emoji = iqEmoji(iq);

    document.getElementById('quizScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.add('active');
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    window.scrollTo(0, 0);

    document.getElementById('resultEmoji').textContent = timeUp ? '⏰' : emoji;
    document.getElementById('resultIQ').textContent = iq;
    document.getElementById('resultGrade').textContent = band.label;
    document.getElementById('resultLabel').textContent =
        `නිවැරදි: ${correct} / ${currentQuestions.length}${timeUp ? ' (වේලාව අවසන්!)' : ''}`;
    document.getElementById('correctCount').textContent = correct;
    document.getElementById('wrongCount').textContent = wrong;
    document.getElementById('skippedCount').textContent = skipped;

    // Build review
    const rev = document.getElementById('reviewContent');
    rev.innerHTML = '';
    const letters = ['A','B','C','D'];
    if (wrongItems.length === 0 && skipped === 0) {
        rev.innerHTML = '<div style="color:#10b981;font-weight:700;text-align:center;padding:16px;">සියලු ප්‍රශ්නවලට නිවැරදිව පිළිතුරු දී ඇත! 🎉</div>';
    } else {
        wrongItems.forEach(item => {
            const d = document.createElement('div');
            d.className = 'review-card';
            d.innerHTML = `
                <div class="review-q"><span style="color:var(--purple-light);font-size:11px;font-weight:700;">ප්‍රශ්නය ${item.idx+1} · ${item.q.cat}</span><br>${item.q.q}</div>
                <div class="review-row">
                    <span class="review-tag tag-wrong">ඔබගේ</span>
                    <span style="color:rgba(244,63,94,0.9)">${letters[item.userAns]}. ${item.q.o[item.userAns]}</span>
                </div>
                <div class="review-row">
                    <span class="review-tag tag-correct">නිවැරදි</span>
                    <span style="color:#10b981">${letters[item.q.a]}. ${item.q.o[item.q.a]}</span>
                </div>
            `;
            rev.appendChild(d);
        });
        currentQuestions.forEach((q, idx) => {
            if (userAnswers[idx] === undefined) {
                const d = document.createElement('div');
                d.className = 'review-card';
                d.innerHTML = `
                    <div class="review-q"><span style="color:var(--purple-light);font-size:11px;font-weight:700;">ප්‍රශ්නය ${idx+1} · ${q.cat}</span><br>${q.q}</div>
                    <div class="review-row">
                        <span class="review-tag tag-skipped">Skip</span>
                        <span style="color:rgba(245,158,11,0.9)">පිළිතුරු නොදෙනු ලැබීය</span>
                    </div>
                    <div class="review-row">
                        <span class="review-tag tag-correct">නිවැරදි</span>
                        <span style="color:#10b981">${letters[q.a]}. ${q.o[q.a]}</span>
                    </div>
                `;
                rev.appendChild(d);
            }
        });
    }

    // Animate gauge after short delay
    setTimeout(() => drawGauge(iq, band), 300);
}

// ============================================================
// SVG GAUGE
// ============================================================
function polarToXY(cx, cy, r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startDeg, endDeg) {
    const s = polarToXY(cx, cy, r, startDeg);
    const e = polarToXY(cx, cy, r, endDeg);
    const large = (endDeg - startDeg) > 180 ? 1 : 0;
    return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}

function drawGauge(iq, band) {
    const cx = 130, cy = 130, r = 90;
    const startDeg = 180, endDeg = 360; // semicircle

    // Track
    document.getElementById('gaugeTrack').setAttribute('d', arcPath(cx, cy, r, startDeg, endDeg));

    // Fill: map IQ 68–145 → 0–100%
    const minIQ = 68, maxIQ = 145;
    const pct = Math.max(0, Math.min(1, (iq - minIQ) / (maxIQ - minIQ)));
    const fillEnd = startDeg + pct * 180;
    document.getElementById('gaugeFill').setAttribute('d', arcPath(cx, cy, r, startDeg, fillEnd));

    // Needle
    const needleDeg = startDeg + pct * 180;
    const needle = document.getElementById('gaugeNeedle');
    setTimeout(() => {
        needle.style.transform = `rotate(${needleDeg - 180}deg)`;
    }, 50);

    // Ticks
    const tickG = document.getElementById('gaugeTicks');
    tickG.innerHTML = '';
    [0, 0.25, 0.5, 0.75, 1].forEach(t => {
        const deg = startDeg + t * 180;
        const inner = polarToXY(cx, cy, r - 14, deg);
        const outer = polarToXY(cx, cy, r + 14, deg);
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', inner.x); line.setAttribute('y1', inner.y);
        line.setAttribute('x2', outer.x); line.setAttribute('y2', outer.y);
        line.setAttribute('stroke', 'rgba(255,255,255,0.25)');
        line.setAttribute('stroke-width', '1.5');
        tickG.appendChild(line);
        // Labels
        const lp = polarToXY(cx, cy, r + 24, deg);
        const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
        const iqVal = Math.round(minIQ + t * (maxIQ - minIQ));
        txt.setAttribute('x', lp.x); txt.setAttribute('y', lp.y + 4);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '9');
        txt.setAttribute('fill', 'rgba(255,255,255,0.40)');
        txt.setAttribute('font-family', 'Poppins, sans-serif');
        txt.textContent = iqVal;
        tickG.appendChild(txt);
    });

    // Center value
    document.getElementById('gaugeVal').textContent = iq;

    // Band segments
    document.querySelectorAll('.iq-band-seg').forEach((seg, i) => {
        seg.classList.remove('active-seg');
        if (i === band.band) seg.classList.add('active-seg');
    });

    // Band label
    const bl = document.getElementById('bandLabel');
    bl.textContent = band.label;
    bl.style.background = band.color + '28';
    bl.style.color = band.color;
    bl.style.border = `1px solid ${band.color}55`;
}

// ============================================================
function toggleReview() {
    const sec = document.getElementById('reviewSection');
    const btn = document.getElementById('reviewBtnText');
    if (sec.classList.contains('open')) {
        sec.classList.remove('open');
        btn.textContent = 'වැරදි ප්‍රශ්න සාරාංශය බලන්න';
    } else {
        sec.classList.add('open');
        btn.textContent = 'සාරාංශය වසන්න';
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function retryQuiz() {
    document.getElementById('reviewSection').classList.remove('open');
    document.getElementById('reviewBtnText').textContent = 'වැරදි ප්‍රශ්න සාරාංශය බලන්න';
    loadQuiz();
}

window.onload = loadQuiz;
</script>

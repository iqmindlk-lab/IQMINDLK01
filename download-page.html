<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #001f3f;
        color: white;
        margin: 0;
        padding: 40px; /* පිටුවේ පෑඩිං වැඩි කළා */
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 1200px; /* පුළුල් කළා */
        margin: 0 auto;
        text-align: center;
    }

    /* PDF කාඩ් සැකැස්ම */
    .pdf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* ස්වයංක්‍රීයව පෙළගැසෙයි */
        gap: 30px;
        margin-top: 40px;
    }

    .pdf-card {
        background: #00a8ff;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .pdf-cover {
        width: 100%;
        height: 300px; /* කවරයේ උස */
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
        border: 2px solid white;
    }

    .dl-link {
        display: block;
        background: linear-gradient(45deg, #00c853, #b2ff59);
        color: #333;
        padding: 12px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="container">
    <h2>📄 PDF DOWNLOAD CENTER</h2>
    
    <div class="pdf-grid">
        <div class="pdf-card">
            <img src="cover1.jpg" alt="Paper 01 Cover" class="pdf-cover">
            <a href="pdfs/paper1.pdf" download class="dl-link">📥 DOWNLOAD PAPER 01</a>
        </div>

        <div class="pdf-card">
            <img src="cover2.jpg" alt="Paper 02 Cover" class="pdf-cover">
            <a href="pdfs/paper2.pdf" download class="dl-link">📥 DOWNLOAD PAPER 02</a>
        </div>

        <div class="pdf-card">
            <img src="cover3.jpg" alt="Paper 03 Cover" class="pdf-cover">
            <a href="pdfs/paper3.pdf" download class="dl-link">📥 DOWNLOAD PAPER 03</a>
        </div>
    </div>
</div>

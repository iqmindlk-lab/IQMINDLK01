<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ MIND PRO - Grade 5 Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            background-color: #06031f;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0,168,255,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(255,65,108,0.10) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 8px 14px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.13);
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #00a8ff 0%, #0070cc 100%);
            border-radius: 24px;
            padding: 26px 28px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,168,255,0.35), 0 2px 8px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
        }

        .header-icon {
            font-size: 38px;
            display: block;
            margin-bottom: 6px;
            animation: bounce 2.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }

        .brand-sub {
            font-size: 12.5px;
            color: rgba(255,255,255,0.80);
            margin-top: 5px;
            font-weight: 600;
        }

        /* ===== SECTION LABEL ===== */
        .section-label {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.4);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .section-label::before, .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }

        /* ===== CATEGORY BUTTONS ===== */
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .cat-btn {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 22px 22px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            position: relative;
            overflow: hidden;
        }

        .cat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.07);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .cat-btn:hover::before { opacity: 1; }
        .cat-btn:hover { transform: translateY(-4px) scale(1.02); }
        .cat-btn:active { transform: scale(0.97); }

        /* රූප සටහන් සමග - Orange/Amber */
        .image-btn {
            background: linear-gradient(135deg, #f7971e 0%, #e65c00 100%);
            box-shadow: 0 10px 32px rgba(247,151,30,0.42);
        }
        .image-btn:hover { box-shadow: 0 16px 42px rgba(247,151,30,0.58); }

        /* රූප සටහන් රහිත - Blue/Cyan */
        .text-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 10px 32px rgba(0,114,255,0.40);
        }
        .text-btn:hover { box-shadow: 0 16px 42px rgba(0,114,255,0.56); }

        .btn-icon-wrap {
            background: rgba(255,255,255,0.18);
            border-radius: 14px;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-icon-wrap i { font-size: 24px; color: #fff; }

        .btn-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.3px;
            line-height: 1.2;
            text-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.78);
            font-weight: 500;
            margin-top: 3px;
        }

        .btn-arrow {
            margin-left: auto;
            font-size: 20px;
            color: rgba(255,255,255,0.55);
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .cat-btn:hover .btn-arrow {
            transform: translateX(5px);
            color: rgba(255,255,255,0.9);
        }

        /* Pulse on image quiz button */
        .image-btn .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 20px;
            border: 2px solid rgba(247,151,30,0.45);
            animation: pulse-ring 2.2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%,-50%) scale(1.06); opacity: 0; }
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: rgba(255,255,255,0.3);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }

        /* ===== FACEBOOK FOLLOW ===== */
        .fb-follow-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: #1877f2;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 6px 22px rgba(24,119,242,0.40);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .fb-follow-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(24,119,242,0.55);
        }
        .fb-follow-btn i { font-size: 20px; }
        .follow-badge {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            margin-left: 4px;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            color: rgba(255,255,255,0.28);
            font-size: 11px;
            text-align: center;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Back -->
    <a href="propage.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> ආපසු යන්න
    </a>

    <!-- Header -->
    <div class="header">
        <span class="header-icon">🧠</span>
        <div class="brand-title">GRADE 5 QUIZ</div>
        <div class="brand-sub">ඔබට අවශ්‍ය Quiz වර්ගය select කරන්න</div>
    </div>

    <!-- Label -->
    <div class="section-label">quiz categories</div>

    <!-- Buttons -->
    <div class="buttons-grid">

        <!-- රූප සටහන් සමග QUIZ -->
        <a href="quiz-image.html" class="cat-btn image-btn">
            <div class="pulse-ring"></div>
            <div class="btn-icon-wrap">

            <div class="btn-text">
                <span class="btn-title">රූප සටහන් සමග QUIZ</span>
                <span class="btn-desc">රූප සහිත ප්‍රශ්න · Visual Learning</span>
            </div>
            <i class="fas fa-chevron-right btn-arrow"></i>
        </a>

        <!-- රූප සටහන් රහිත QUIZ -->
        <a href="quiz-text.html" class="cat-btn text-btn">
            <div class="btn-icon-wrap">
                <i class="fas fa-font"></i>
            </div>
            <div class="btn-text">
                <span class="btn-title">රූප සටහන් රහිත QUIZ</span>
                <span class="btn-desc">Text පමණක් · සිංහල · ගණිතය · සා.දැ.</span>
            </div>
            <i class="fas fa-chevron-right btn-arrow"></i>
        </a>

    </div>

    <!-- Divider -->
    <div class="divider">follow us</div>

    <!-- Facebook Follow -->
    <a href="https://web.facebook.com/iqmind.lk" target="_blank" class="fb-follow-btn">
        <i class="fab fa-facebook"></i>
        IQ MIND Follow කරන්න
        <span class="follow-badge">FOLLOW</span>
    </a>

    <div class="footer-note">© 2024 IQ MIND PRO · All Rights Reserved</div>

</div>

</body>
</html>

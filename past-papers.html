      let idleTime = 0;

      function resetIdleTime() { idleTime = 0; }

      document.addEventListener("mousemove", resetIdleTime);
      document.addEventListener("keypress", resetIdleTime);
      document.addEventListener("mousedown", resetIdleTime);
      document.addEventListener("scroll", resetIdleTime);
      document.addEventListener("touchstart", resetIdleTime);
      document.addEventListener("touchmove", resetIdleTime);

      setInterval(async () => {
          idleTime++;
          if (idleTime >= 5) {
              idleTime = 0;

              } catch (e) { console.error(e); }
              localStorage.removeItem("iq_user_id");
              window.location.href = "proiqmind.html";
          }

          if (userId) {

          }

<script>
    // ── GitHub Raw Base URL ──────────────────────────────────
    // ඔබේ GitHub username සහ repo name මෙතන දාන්න
    const GITHUB_BASE = "https://iqmindlk-lab.github.io/IQMINDLK01";

    // ── Years ────────────────────────────────────────────────
    const years = [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025];

    // ── Paper cards builder ──────────────────────────────────
    // folderName  = GitHub folder නම  (e.g. "Grade5")
    // filePrefix  = file නම prefix    (e.g. "2018paper" / "2018marking")
    // examLabel   = card title        (e.g. "ශිෂ්‍යත්ව විභාගය")
    function buildPaperCards(listEl, folderName, examLabel) {
        listEl.innerHTML = '';
        years.forEach(y => {
            const paperURL   = `${GITHUB_BASE}/${folderName}/${y}paper.pdf`;
            const markingURL = `${GITHUB_BASE}/${folderName}/${y}marking.pdf`;

            const card = document.createElement('div');
            card.className = 'paper-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="year-badge">
                        <span class="year-num">${y}</span>
                        <span class="year-label">year</span>
                    </div>
                    <div class="paper-info">
                        <span class="paper-name">${examLabel} ${y}</span>
                        <span class="paper-meta">PDF · Paper &amp; Marking Scheme</span>
                    </div>
                </div>
                <div class="card-btns">
                    <a href="${paperURL}" download="${y}paper.pdf" class="download-btn btn-paper" target="_blank">
                        <i class="fas fa-download"></i> Paper Download
                    </a>
                    <a href="${markingURL}" download="${y}marking.pdf" class="download-btn btn-marking" target="_blank">
                        <i class="fas fa-check-circle"></i> Marking Scheme
                    </a>
                </div>`;
            listEl.appendChild(card);
        });
    }

    // ── GitHub folder mapping ────────────────────────────────
    // tab + subject key → GitHub folder name
    const FOLDER_MAP = {
        // Scholarship
        "scholarship": "Grade5",

        // O/L
        "ol-Sinhala":     "OL/Sinhala",
        "ol-Tamil":       "OL/Tamil",
        "ol-Maths":       "OL/Maths",
        "ol-Science":     "OL/Science",
        "ol-English":     "OL/English",
        "ol-Religion":    "OL/Religion",
        "ol-Art":         "OL/Art",
        "ol-Drama":       "OL/Drama",
        "ol-Music":       "OL/Music",
        "ol-Dance":       "OL/Dance",
        "ol-ICT":         "OL/ICT",
        "ol-Agriculture": "OL/Agriculture",
        "ol-HomeEcon":    "OL/HomeEcon",
        "ol-AppArt":      "OL/AppArt",
        "ol-Electronics": "OL/Electronics",

        // A/L
        "al-Bio":        "AL/Bio",
        "al-Maths":      "AL/Maths",
        "al-Technology": "AL/Technology",
        "al-Arts":       "AL/Arts",
        "al-Commerce":   "AL/Commerce",
    };

    // ── Scholarship init ─────────────────────────────────────
    buildPaperCards(
        document.getElementById('scholarship-papers'),
        FOLDER_MAP["scholarship"],
        'ශිෂ්‍යත්ව විභාගය'
    );

    // ── Main tab switching ────────────────────────────────────
    function switchMainTab(name, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
        closeSubject('ol');
        closeSubject('al');
    }

    // ── Subject open / close ──────────────────────────────────
    function openSubject(level, key, label, icon) {
        const listEl   = document.getElementById(level + '-papers-list');
        const mapKey   = level + '-' + key;
        const folder   = FOLDER_MAP[mapKey] || (level.toUpperCase() + '/' + key);
        document.getElementById(level + '-subject-title').textContent = icon + ' ' + label;
        buildPaperCards(listEl, folder, label);
        document.getElementById(level + '-subject-view').style.display = 'none';
        document.getElementById(level + '-papers-view').classList.add('active');
    }

    function closeSubject(level) {
        const sv = document.getElementById(level + '-subject-view');
        const pv = document.getElementById(level + '-papers-view');
        if (sv) sv.style.display = '';
        if (pv) pv.classList.remove('active');
    }
</script>
</body>
</html>

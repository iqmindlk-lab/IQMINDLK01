    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBHgRwGTk_YF11byElDa5dH_GkODzuE2JY",
        authDomain: "iq-pro-8661d.firebaseapp.com",
        projectId: "iq-pro-8661d",
        storageBucket: "iq-pro-8661d.firebasestorage.app",
        messagingSenderId: "825067863061",
        appId: "1:825067863061:web:9100baf84c85e2984e221c",
        measurementId: "G-HSL89D29GR"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const userId = localStorage.getItem("iq_user_id");

      if (!userId) { window.location.href = "proiqmind.html"; }

      async function checkSubscription() {
          try {
              const docRef = doc(db, "allowed_users", userId);
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                  const data = docSnap.data();
                  const expiryDate = data.expiry_date.toDate();
                  const today = new Date();
                  const timeDiff = expiryDate.getTime() - today.getTime();
                  const daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));
                  const clockField = document.getElementById("subClock");
                  if (daysLeft > 0) {
                      clockField.innerHTML = `<i class="fas fa-clock"></i> PRO ගිණුමේ වලංගු කාලය තව දින <span>${daysLeft} කින්</span> අවසන් වේ.`;
                  } else {
                      clockField.innerHTML = `<i class="fas fa-exclamation-circle"></i> ඔබගේ වලංගු කාලය අවසන් වී ඇත!`;
                  }
              }
          } catch (error) { console.error("Error:", error); }
      }
      checkSubscription();

      async function manualLogout() {
          if (confirm("ඔබට මෙම ගිණුමෙන් ඉවත් වීමට අවශ්‍යද?")) {
              try {
                  const docRef = doc(db, "allowed_users", userId);
                  await updateDoc(docRef, { is_logged_in: false });
                  localStorage.removeItem("iq_user_id");
                  window.location.href = "proiqmind.html";
              } catch (error) {
                  console.error("Logout Error:", error);
                  alert("Logout වීමේදී දෝෂයක් ඇති විය. නැවත උත්සාහ කරන්න.");
              }
          }
      }
      window.manualLogout = manualLogout;

      let idleTime = 0;
      function resetIdleTime() { idleTime = 0; }
      document.onmousemove = resetIdleTime;
      document.onkeypress = resetIdleTime;

      setInterval(async () => {
          idleTime++;
          if (idleTime > 5) {
              alert("ඔබ විනාඩි 5ක් අක්‍රියව සිටි නිසා ලොග් අවුට් විය.");
              const docRef = doc(db, "allowed_users", userId);
              await updateDoc(docRef, { is_logged_in: false });
              localStorage.removeItem("iq_user_id");
              window.location.href = "proiqmind.html";
          }
      }, 60000);

      window.addEventListener("beforeunload", async () => {
          if(userId) {
              const docRef = doc(db, "allowed_users", userId);
              await updateDoc(docRef, { is_logged_in: false });
          }
      });
    </script>

        }
        .header::after {
            content: '';

            border-radius: 50%;

        .header-icon {
            font-size: 38px;
            display: block;
            margin-bottom: 6px;

            0%, 100% { transform: translateY(0); }

        }

            gap: 10px;
            width: 100%;
        }
        .subject-btn {

        .paper-name {

        }

            font-size: 11px;

            font-weight: 500;
        }
        .card-btns {

            gap: 10px;
            padding: 0 16px 16px;

        .download-btn {
            flex: 1;

            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;

        }
        .download-btn:active { transform: scale(0.97); }
        .download-btn i { font-size: 12px; }
        .btn-paper {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255,65,108,0.38);
        }
        .btn-paper:hover { box-shadow: 0 6px 22px rgba(255,65,108,0.56); transform: scale(1.03); }
        .btn-marking {
            background: linear-gradient(135deg, #f7b733 0%, #e08900 100%);

        .footer-note {

        .section-label {

        }
        .section-label::before, .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }
    </style>
</head>

                </button>
                <button class="subject-btn" onclick="openSubject('al','Technology','තාක්ෂණය (Technology)','⚙️')">
                    <span class="subj-icon">⚙️</span>තාක්ෂණය
                </button>
                <button class="subject-btn" onclick="openSubject('al','Arts','කලා (Arts)','🎭')">
                    <span class="subj-icon">🎭</span>කලා
                </button>
                <button class="subject-btn" onclick="openSubject('al','Commerce','වාණිජ (Commerce)','📊')">
                    <span class="subj-icon">📊</span>වාණිජ
                </button>
            </div>
        </div>

        <!-- Papers view -->
        <div class="papers-view" id="al-papers-view">
            <div class="subject-header">
                <button class="back-subject-btn" onclick="closeSubject('al')">
                    <i class="fas fa-arrow-left"></i> ආපසු
                </button>
                <div class="subject-title-pill" id="al-subject-title">—</div>
            </div>
            <div class="papers-list" id="al-papers-list"></div>
        </div>
    </div>

    <div class="footer-note">© 2024 IQ MIND PRO · All Rights Reserved</div>

</div>

<script>
    // ── Helpers ──────────────────────────────────────────────
    const years = [2018,2019,2020,2021,2022,2023,2024,2025];

    function buildPaperCards(listEl, prefix, examLabel) {
        listEl.innerHTML = '';
        years.forEach(y => {
            const card = document.createElement('div');
            card.className = 'paper-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="year-badge">
                        <span class="year-num">${y}</span>
                        <span class="year-label">year</span>
                    </div>
                    <div class="paper-info">
                        <span class="paper-name">${examLabel} ${y}</span>
                        <span class="paper-meta">PDF · Paper &amp; Marking Scheme</span>
                    </div>
                </div>
                <div class="card-btns">
                    <a href="papers/${prefix}-${y}-paper.pdf" class="download-btn btn-paper" target="_blank">
                        <i class="fas fa-download"></i> Paper Download
                    </a>
                    <a href="marking/${prefix}-${y}-marking.pdf" class="download-btn btn-marking" target="_blank">
                        <i class="fas fa-check-circle"></i> Marking Scheme
                    </a>
                </div>`;
            listEl.appendChild(card);
        });
    }

    // ── Scholarship tab init ──────────────────────────────────
    buildPaperCards(
        document.getElementById('scholarship-papers'),
        'scholarship',
        'ශිෂ්‍යත්ව විභාගය'
    );

    // ── Main tab switching ────────────────────────────────────
    function switchMainTab(name) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        event.currentTarget.classList.add('active');
        // reset subject views when switching tabs
        closeSubject('ol');
        closeSubject('al');
    }

    // ── Subject open / close ──────────────────────────────────
    function openSubject(level, key, label, icon) {
        const listEl = document.getElementById(level + '-papers-list');
        document.getElementById(level + '-subject-title').textContent = icon + ' ' + label;
        const prefix = level + '-' + key.toLowerCase();
        buildPaperCards(listEl, prefix, label);
        document.getElementById(level + '-subject-view').style.display = 'none';
        const pv = document.getElementById(level + '-papers-view');
        pv.classList.add('active');
    }

    function closeSubject(level) {
        const sv = document.getElementById(level + '-subject-view');
        const pv = document.getElementById(level + '-papers-view');
        if (sv) sv.style.display = '';
        if (pv) pv.classList.remove('active');
    }
</script>
</body>
</html>

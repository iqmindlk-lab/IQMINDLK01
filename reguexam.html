<script>

const quizData = [

    { q: "ලෝක රේගු සංවිධානය (World Customs Organization - WCO) විසින් ප්‍රකාශයට පත් කර ඇති පරිදි, සෑම වර්ෂයකම 'ජාත්‍යන්තර රේගු දිනය' (International Customs Day) සමරනු ලබන්නේ කිනම් දිනයකද?", options: ["(A) ජනවාරි 01 වනදා", "(B) ජනවාරි 26 වනදා", "(C) මාර්තු 08 වනදා", "(D) සැප්තැම්බර් 21 වනදා"], correct: 1 },
    { q: "වර්තමාන ශ්‍රී ලංකා රේගු ඉතිහාසයේ වැදගත් සන්ධිස්ථානයක් වන, ව්‍යවස්ථාපිත ආයතනයක් ලෙස 'ශ්‍රී ලංකා රේගු දෙපාර්තමේන්තුව' නිල වශයෙන් පිහිටුවනු ලැබුවේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1802 දී", "(B) වර්ෂ 1815 දී", "(C) වර්ෂ 1948 දී", "(D) වර්ෂ 1972 දී"], correct: 0 },
    { q: "ශ්‍රී ලංකාවට ආනයනය කරනු ලබන සහ අපනයනය කරනු ලබන භාණ්ඩ වර්ගීකරණය සඳහා ජාත්‍යන්තරව භාවිත වන 'හර්මොනයිස්ඩ් පද්ධතිය' (Harmonized System - HS Code) ලෝක රේගු සංවිධානය විසින් ප්‍රථම වරට හඳුන්වා දෙනු ලැබුවේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1980 දී", "(B) වර්ෂ 1988 දී", "(C) වර්ෂ 1995 දී", "(D) වර්ෂ 2002 දී"], correct: 1 },
    { q: "ශ්‍රී ලංකා රේගු පරිපාලනයේ සහ මෙහෙයුම් කටයුතුවල දැනට භාවිත වන ප්‍රධානතම නීතිමය ලියවිල්ල වන 'රේගු ආඥා පනත' (Customs Ordinance) මුලින්ම පනවනු ලැබුවේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1869 දී", "(B) වර්ෂ 1947 දී", "(C) වර්ෂ 1969 දී", "(D) වර්ෂ 1988 දී"], correct: 0 },
    { q: "ශ්‍රී ලංකාවේ මුදල්, ආර්ථික ස්ථායීකරණ සහ ජාතික ප්‍රතිපත්ති අමාත්‍යාංශය යටතේ පවතින ශ්‍රී ලංකා මහ බැංකුව (Central Bank of Sri Lanka) නිල වශයෙන් සිය මෙහෙයුම් කටයුතු ආරම්භ කරන ලද්දේ කිනම් වර්ෂයක, කිනම් දිනයකද?", options: ["(A) 1948 පෙබරවාරි 04 වනදා", "(B) 1950 අගෝස්තු 28 වනදා", "(C) 1956 අප්‍රේල් 12 වනදා", "(D) 1972 මැයි 22 වනදා"], correct: 1 },
    { q: "ජාත්‍යන්තර වෙළඳාමට සෘජුවම බලපාන, ශ්‍රී ලංකාව සහ ඉන්දියාව අතර අත්සන් තබන ලද සන්ධිස්ථානාත්මක 'ඉන්දු-ලංකා නිදහස් වෙළඳ ගිවිසුම' (ISFTA) නිල වශයෙන් ක්‍රියාත්මක වීම ආරම්භ වූයේ කිනම් වර්ෂයේ සිටද?", options: ["(A) වර්ෂ 1998 දී", "(B) වර්ෂ 2000 දී", "(C) වර්ෂ 2002 දී", "(D) වර්ෂ 2005 දී"], correct: 1 },
    { q: "ශ්‍රී ලංකා රේගුව මඟින් ක්‍රියාත්මක කරනු ලබන, බුද්ධිමය දේපළ අයිතිවාසිකම් සුරැකීමේ නීතියට අදාළ 'බුද්ධිමය දේපළ පනත' (Intellectual Property Act No. 36) ශ්‍රී ලංකා පාර්ලිමේන්තුවේදී සම්මත කරන ලද්දේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1979 දී", "(B) වර්ෂ 1990 දී", "(C) වර්ෂ 2003 දී", "(D) වර්ෂ 2015 දී"], correct: 2 },
    { q: "ගෝලීය වෙළඳාම සහ රේගු නිශ්කාෂණ කටයුතු වඩාත් කාර්යක්ෂම කිරීමට උපකාරී වන ලෝක වෙළඳ සංවිධානයේ (WTO) 'වෙළඳ පහසුකම් සැලසීමේ ගිවිසුම' (Trade Facilitation Agreement - TFA) ලෝක මට්ටමින් නිල වශයෙන් බලාත්මක වූයේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 2010 දී", "(B) වර්ෂ 2013 දී", "(C) වර්ෂ 2017 දී", "(D) වර්ෂ 2020 දී"], correct: 2 },
    { q: "ලෝක රේගු සංවිධානයේ (WCO) ශ්‍රී ලංකාව ද සාමාජිකත්වය දරන අතර, මෙම වැදගත් ජාත්‍යන්තර ආයතනය (එවකට රේගු සහයෝගිතා කවුන්සිලය - CCC ලෙස) ප්‍රථම වරට පිහිටුවන ලද්දේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1945 දී", "(B) වර්ෂ 1952 දී", "(C) වර්ෂ 1965 දී", "(D) වර්ෂ 1994 දී"], correct: 1 },
    { q: "ශ්‍රී ලංකා රේගු ඉතිහාසයේ ඩිජිටල්කරණ පෙරළියක් ඇති කරමින්, ਰේගු නිශ්කාෂණ කටයුතු ස්වයංක්‍රීයව සිදු කිරීම සඳහා දැනට භාවිත වන 'Asycuda World' (ඇසිකුඩා වර්ල්ඩ්) පද්ධතිය ලංකාවට හඳුන්වා දීම ආරම්භ වූයේ කිනම් වර්ෂයේදීද?", options: ["(A) වර්ෂ 1995 දී", "(B) වර්ෂ 2002 දී", "(C) වර්ෂ 2012 දී", "(D) වර්ෂ 2018 දී"], correct: 2 },
    { q: "ශ්‍රී ලංකාවේ මෑතකාලීන මූල්‍ය ප්‍රතිසංස්කරණ යටතේ, දේශීය ආදායම් එකතු කිරීම සහ බදු පරිපාලනය ශක්තිමත් කිරීම සඳහා හඳුන්වා දුන් 'දේශීය ආදායම් (සංශෝධන) පනත' මඟින් පුද්ගල ආදායම් බදු සහ වැට් (VAT) බදු ප්‍රතිශතයන් සංශෝධනය කිරීම සිදු විය. මෙරට දැනට ක්‍රියාත්මක වන සම්මත වැට් බදු (Value Added Tax) අනුපාතිකය කොපමණද?", options: ["(A) 12%", "(B) 15%", "(C) 18%", "(D) 21%"], correct: 2 },
    { q: "ජාත්‍යන්තර වෙළඳාම සහ කලාපීය සහයෝගිතාව පුළුල් කරමින්, ශ්‍රී ලංකාව සහ තායිලන්තය අතර නිදහස් වෙළඳ ගිවිසුම (Sri Lanka-Thailand Free Trade Agreement - SLTFTA) නිල වශයෙන් අත්සන් තබනු ලැබුවේ කිනම් මාසයේදීද?", options: ["(A) 2023 ඔක්තෝබර්", "(B) 2024 පෙබරවාරි", "(C) 2024 දෙසැම්බර්", "(D) 2025 මාර්තු"], correct: 1 },
    { q: "ශ්‍රී ලංකා රේගුවේ ආදායම් කාන්දුවීම් වැළැක්වීම සහ විනිවිදභාවය ඉහළ නැංවීම සඳහා මුදල් අමාත්‍යාංශයේ උපදෙස් මත හඳුන්වා දීමට පියවර ගත්, මෙරටට ආනයනය කරනු ලබන සියලුම මෝටර් රථ සහ ඉලෙක්ට්‍රොනික භාණ්ඩ සඳහා අනිවාර්ය කෙරෙන නව ඩිජිටල් හඳුනාගැනීමේ ක්‍රමවේදය කුමක්ද?", options: ["(A) QR Tracking Code System", "(B) Digital Tax Stamp and Traceability System", "(C) Automated Customs Barcode (ACB)", "(D) National Electronic Cargo Registry"], correct: 1 },
    { q: "ශ්‍රී ලංකාව මුහුණ දුන් ආර්ථික අර්බුදයෙන් මිදීම සඳහා ජාත්‍යන්තර මූල්‍ය අරමුදල (IMF) සමඟ ඇති කරගත් විස්තීර්ණ අරමුදල් පහසුකම (Extended Fund Facility - EFF) යටතේ, මෙරට රාජ්‍ය ආදායම දළ දේශීය නිෂ්පාදිතයෙන් (GDP) නිශ්චිත ප්‍රතිශතයක් දක්වා ඉහළ නැංවීමට රේගු සහ දේශීය ආදායම් දෙපාර්තමේන්තුවලට ඉලක්ක ලබා දී ඇත. IMF වැඩසටහන මඟින් අපේක්ෂිත එම මූලික රාජ්‍ය ආදායම් ඉලක්කය දළ දේශීය නිෂ්පාදිතයේ ප්‍රතිශතයක් ලෙස කොපමණද?", options: ["(A) 10%", "(B) 12%", "(C) 15%", "(D) 18%"], correct: 2 },
    { q: "මෑතකදී ශ්‍රී ලංකා රේගුව විසින් රුපියල් බිලියන ගණනක බදු වංචාවක් අනාවරණය කරගත්, 'සංක්‍රමණික භාණ්ඩ' (Transshipment Cargo) ලෙස ව්‍යාජ ලේඛන සකසා මෙරට වෙළඳපොළට හොර රහසේ මුදා හැරීමට උත්සාහ කළ, රේගු බදු ඉහළම මට්ටමක පවතින ප්‍රධානතම වාණිජ භාණ්ඩය කුමක්ද?", options: ["(A) එනසාල් සහ කුළුබඩු", "(B) රත්තරන් සහ ස්වර්ණාභරණ", "(C) එතනෝල් සහ විදේශීය මත්පැන්", "(D) වියළි පුවක් සහ කරදමුංගු"], correct: 2 },
    { q: "ශ්‍රී ලංකාව කලාපීය වෙළඳ කටයුතු සක්‍රීය කිරීම සඳහා 'කලාපීය විස්තීර්ණ ආර්ථික හවුල්කාරිත්වය' (Regional Comprehensive Economic Partnership - RCEP) නම් ලොව විශාලතම වෙළඳ කලාපීය සංවිධානය සමඟ එකතු වීමට නිල වශයෙන් අයදුම් කර ඇත. මෙම RCEP නිදහස් වෙළඳ කලාපයේ මූලිකත්වය ගෙන කටයුතු කරන ප්‍රධානතම ආසියානු ආර්ථික බලවතා කවුද?", options: ["(A) ඉන්දියාව", "(B) ජපානය", "(C) චීනය", "(D) දකුණු කොරියාව"], correct: 2 },
    { q: "ඩිජිටල් ආර්ථිකයක් කරා යන ගමනේදී, ශ්‍රී ලංකා රේගුව හරහා සිදුවන ජාත්‍යන්තර වාණිජ කටයුතු තනි ඩිජිටල් පද්ධතියක් යටතට ගෙන ඒම සඳහා (සියලුම රාජ්‍ය ආයතන, බැංකු සහ නැව් සමාගම් සම්බන්ධ කරමින්) දැනට ශ්‍රී ලංකා තොරතුරු හා සන්නිවේදන තාක්ෂණ නියෝජිතායතනය (ICTA) සමඟ එක්ව සංවර්ධනය කෙරෙන ජාතික පද්ධතිය කුමක්ද?", options: ["(A) Sri Lanka Customs Port Authority (SLCPA)", "(B) Sri Lanka National Single Window (SLNSW)", "(C) Sri Lanka Electronic Data Interchange (SLEDI)", "(D) Lanka Gate Customs Portal"], correct: 1 },
    { q: "ලෝක වෙළඳ සංවිධානය (WTO) විසින් නිකුත් කරන ලද නවතම වාර්තාවලට අනුව, ගෝලීය සැපයුම් දාමයන්ට (Global Supply Chains) සහ සාගර මාර්ග හරහා කෙරෙන රේගු වෙළඳාමට මෑතකාලීනව දැඩිම බලපෑමක් එල්ල කළ, සූවස් ඇළ මාර්ගය අවහිර වීමට හේතු වූ 'රතු මුහුදේ අර්බුදය' (Red Sea Crisis) සඳහා සෘජුවම වගකිව යුතු සන්නද්ධ කණ්ඩායම කුමක්ද?", options: ["(A) හවුති (Houthi) සන්නද්ධ කණ්ඩායම", "(B) හමාස් (Hamas) සංවිධානය", "(C) හිස්බුල්ලා (Hezbollah) සංවිධානය", "(D) අල්-කයිඩා (Al-Qaeda) සංවිධානය"], correct: 0 },
    { q: "වර්තමාන ශ්‍රී ලංකාවේ මූල්‍ය ස්ථාවරත්වය සුරැකීම සඳහා ක්‍රියාත්මක වන, නව 'මහ බැංකු පනත' මඟින් ශ්‍රී ලංකා මහ බැංකුවට ලැබී ඇති ප්‍රධානතම ව්‍යවස්ථාපිත වෙනස්කම කුමක්ද?", options: ["(A) රේගු බදු සෘජුවම පාලනය කිරීමේ බලය ලැබීම", "(B) ਰජයට අසීමිත ලෙස මුදල් අච්චු ගසා දීමේ බලය ලැබීම", "(C) මුදල් අමාත්‍යාංශයෙන් ස්වාධීන වූ ආයතනයක් බවට පත්වීම (Operational Autonomy)", "(D) වාණිජ බැංකුවල සියලුම කොටස් රජයට පවරා ගැනීම"], correct: 2 },
    { q: "ශ්‍රී ලංකා ආණ්ඩුක්‍රම ව්‍යවස්ථාවට අනුව, රේගු බදු ඇතුළු සියලුම රාජ්‍ය ආදායම් තැන්පත් කරනු ලබන, පාර්ලිමේන්තුවේ සෘජු පාලනයට යටත් වන ප්‍රධාන අරමුදල හඳුන්වනු ලබන්නේ කුමන නමකින්ද?", options: ["(A) ඒකාබද්ධ අරමුදල (Consolidated Fund)", "(B) ජනාධිපති අරමුදල (President's Fund)", "(C) ජාතික සංවර්ධන අරමුදල (National Development Fund)", "(D) මහජන භාරකාර අරමුදල (Public Trustee Fund)"], correct: 0 },
    { q: "ලෝක වෙළඳ සංවිධානය (World Trade Organization - WTO) මඟින් ජාත්‍යන්තර වෙළඳාමේදී බදු නොවන බාධක ඉවත් කිරීමට කටයුතු කරයි. මෙම වැදගත් ජාත්‍යන්තර සංවිධානයේ මූලස්ථානය පිහිටා ඇත්තේ කිනම් නගරයකද?", options: ["(A) ඇමරිකාවේ නිව්යෝර්ක් නුවර", "(B) ප්‍රංශයේ පැරිස් නුවර", "(C) ස්විට්සර්ලන්තයේ ජිනීවා නුවර", "(D) එක්සත් රාජධානියේ ලන්ඩන් නුවර"], correct: 2 },
    { q: "ශ්‍රී ලංකාවේ ආර්ථික භූගෝල විද්‍යාවට අනුව, මෑතකදී වාණිජ කටයුතු සහ ජාත්‍යන්තර මගී ප්‍රවාහන නෞකා මෙහෙයුම් ඉහළ නැංවීම සඳහා විශාල වශයෙන් සංවර්ධනය කරන ලද, ලංකාවේ පිහිටි දෙවන විශාලතම ස්වාභාවික වරාය (Natural Harbour) කුමක්ද?", options: ["(A) කොළඹ වරාය", "(B) ත්‍රිකුණාමලය වරාය", "(C) හම්බන්තොට මාගම්පුර වරාය", "(D) ගාලු වරාය"], correct: 1 },
    { q: "ආර්ථික විද්‍යා සංකල්පයන්ට අනුව, රටක දේශසීමාව තුළ වසරක් ඇතුළත නිෂ්පාදනය කරනු ලබන සියලුම නිමි භාණ්ඩ හා සේවාවල මුළු වෙළඳපොළ වටිනාකම හඳුන්වනු ලබන්නේ කුමන නමකින්ද?", options: ["(A) දළ ජාතික නිෂ්පාදිතය (GNP)", "(B) දළ දේශීය නිෂ්පාදිතය (GDP)", "(C) ශුද්ධ ජාතික නිෂ්පාදිතය (NNP)", "(D) ඒක පුද්ගල ආදායම (Per Capita Income)"], correct: 1 },

    { q: "ශ්‍රී ලංකා ආණ්ඩුක්‍රම ව්‍යවස්ථාවට අනුව රේගු බදු පැනවීම සහ එකතු කිරීම පිළිබඳ අවසාන බලය පැවරී ඇත්තේ කාටද?", options: ["ජනාධිපතිවරයාට", "පාර්ලිමේන්තුවට", "මධ්‍යම බැංකු අධිපතිවරයාට", "රේගු අධ්‍යක්ෂ ජනරාල්වරයාට"], correct: 1 },
    { q: "ශ්‍රී ලංකාවට ආනයනය කිරීම සපුරා තහනම් කර ඇති (Prohibited) ද්‍රව්‍යයක් නොවන්නේ පහත සඳහන් ඒවයින් කුමක්ද?", options: ["ව්‍යාජ මුදල් නෝට්ටු සහ කාසි", "අන්තරායකර මත්ද්‍රව්‍ය", "වලංගු බලපත්‍රයක් සහිතව ආනයනය කරන ඖෂධ වර්ග", "වනසත්ත්ව හා ශාක විශේෂ පිළිබඳ ජාත්‍යන්තර වෙළෙඳ සම්මුතිය (CITES) මඟින් තහනම් කර ඇති සතුන්"], correct: 2 },
    { q: "සිංහල භාෂාවේ එන \"රේගුව\" යන වචනය බිඳී ඇත්තේ කුමන පෘතුගීසි වචනයෙන්ද?", options: ["Alfandega (අල්ෆැන්ඩේගා)", "Renda (රෙන්ද)", "Regua (රේගුවා)", "Feitoria (ෆෙයිතෝරියා)"], correct: 2 },
    { q: "ශ්‍රී ලංකාවේ ප්‍රධානතම රේගු මූලස්ථාන ගොඩනැගිල්ල පිහිටා ඇත්තේ කොළඹ කුමන ප්‍රදේශයකද?", options: ["කොළඹ කොටුව (Fort)", "පිටකොටුව (Pettah)", "මීතොටුමුල්ල", "ඩිමෙල් වත්ත (කොම්පඤ්ඤවීදිය)"], correct: 0 },
    { q: "පහත සඳහන් ශ්‍රී ලංකාවේ වරායවල් අතුරින් \"රේගු වරායක්\" (Customs Port) ලෙස ප්‍රකාශයට පත් කර නොමැති වරාය කුමක්ද?", options: ["කොළඹ වරාය", "හම්බන්තොට මාගම් රුහුණුපුර වරාය", "ත්‍රිකුණාමලය වරාය", "බෙරුවල ධීවර වරාය"], correct: 3 },
    { q: "රේගු පනත උල්ලංඝනය කරමින් හොර රහසේ භාණ්ඩ රට තුළට රැගෙන ඒම හෝ රටින් පිට කිරීම හඳුන්වන නීතිමය වචනය කුමක්ද?", options: ["ජාවාරම් කිරීම (Smuggling)", "කළු සල්ලි විශුද්ධිකරණය (Money Laundering)", "කොල්ලකෑම (Piracy)", "වංචා කිරීම (Fraud)"], correct: 0 },
    { q: "දේශීය කර්මාන්ත ආරක්ෂා කිරීම සහ ආනයන පාලනය කිරීම වෙනුවෙන් ආනයනික භාණ්ඩ මත පනවනු ලබන අතිරේක රේගු බදු වර්ගයක් හඳුන්වන්නේ කෙසේද?", options: ["වැට් බද්ද (VAT)", "සෙස් බද්ද (Cess)", "රඳවා ගැනීමේ බද්ද (WHT)", "ආදායම් බද්ද (Income Tax)"], correct: 1 },
    { q: "\"WCO\" (World Customs Organization) හි වත්මන් සාමාජික රටවල් සංඛ්‍යාව ආසන්න වශයෙන් කොපමණද?", options: ["150", "185", "210", "120"], correct: 1 },
    { q: "වාණිජ මට්ටමෙන් තොරව, විදේශගතව සිට පැමිණෙන මගියෙකුට තමන්ගේ පෞද්ගලික පරිහරණය සඳහා බදු රහිතව භාණ්ඩ රැගෙන ඒමට රේගුව මඟින් ලබාදෙන සහනය හඳුන්වන්නේ කුමන නමකින්ද?", options: ["Green Channel (හරිත මාවත)", "Baggage Allowance (ගමන් මලු දීමනාව / සහනය)", "Cargo Release (භාණ්ඩ නිදහස් කිරීම)", "Duty-Free Shop (බදු රහිත වෙළඳසැල)"], correct: 1 }
];

let questions = [];
let currentIdx = 0;
let score = 0;
let answersLog = [];

/* ටයිමර් එක සඳහා විචල්‍යයන් (Variables) */
let timerInterval;
let timeLeft = 30;

function prepareQuestions() {
    let allQuestions = [...quizData];
    for (let i = allQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
    }
    questions = allQuestions.slice(0, 10);
}

// ටයිමර් එක ආරම්භ කරන Function එක
function startTimer() {
    clearInterval(timerInterval); // කලින් දිවෙමින් තිබූ ටයිමර් නවත්වන්න
    timeLeft = 30; // කාලය තත්පර 30 ලෙස සැකසීම
    document.getElementById("time-left").innerText = timeLeft;

    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("time-left").innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleTimeOut(); // කාලය අවසන් වූ විට ක්‍රියාත්මක වන කොටස
        }
    }, 1000);
}

// කාලය ඉවර වූ විට සිදුවන දේ
function handleTimeOut() {
    const correctIdx = questions[currentIdx].correct;
    const options = document.querySelectorAll(".option");
    
    // සියලු බටන්ස් ක්ලික් කළ නොහැකි ලෙස අක්‍රිය කිරීම
    options.forEach(b => b.style.pointerEvents = "none");
    
    // නිවැරදි පිළිතුර කොළ පාටින් පෙන්වීම
    options[correctIdx].classList.add("correct");

    // ලොග් එකට වැරදි පිළිතුරක් ලෙස ඇතුළත් කිරීම
    answersLog.push({ 
        q: questions[currentIdx].q, 
        correct: questions[currentIdx].options[correctIdx], 
        isCorrect: false 
    });

    document.getElementById("next-btn").style.display = "block";
}

function loadQuestion(){
    startTimer(); // ප්‍රශ්නයක් ලෝඩ් වන විට ටයිමර් එක පටන් ගන්න
    const q = questions[currentIdx];
    document.getElementById("current-q-num").innerText = currentIdx + 1;
    document.getElementById("question-text").innerText = q.q;
    const list = document.getElementById("options-list");
    list.innerHTML = "";
    document.getElementById("next-btn").style.display = "none";
    q.options.forEach((opt,i)=>{
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = opt;
        btn.onclick = () => selectOption(i,btn);
        list.appendChild(btn);
    });
}

function selectOption(index,element){
    clearInterval(timerInterval); // පරිශීලකයා පිළිතුරක් තෝරාගත් පසු ටයිමර් එක නවත්වන්න
    const correctIdx = questions[currentIdx].correct;
    const options = document.querySelectorAll(".option");
    options.forEach(b=>b.style.pointerEvents="none");
    let isCorrect = index === correctIdx;
    if(isCorrect){
        element.classList.add("correct");
        score++;
    } else {
        element.classList.add("wrong");
        options[correctIdx].classList.add("correct");
    }
    answersLog.push({ q: questions[currentIdx].q, correct: questions[currentIdx].options[correctIdx], isCorrect: isCorrect });
    document.getElementById("next-btn").style.display = "block";
}

function handleNext(){
    currentIdx++;
    if(currentIdx < questions.length){
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults(){
    clearInterval(timerInterval); // ප්‍රතිඵල පෙන්වන විට ටයිමර් එක සම්පූර්ණයෙන්ම නවත්වන්න
    document.getElementById("quiz-area").classList.add("hidden");
    document.getElementById("result-area").classList.remove("hidden");
    const percent = Math.round((score/questions.length)*100);
    document.getElementById("final-score").innerText = `Score: ${score}/${questions.length} (${percent}%)`;
    let html = "<strong>Wrong Answers Only:</strong><br><br>";
    let hasWrong = false;
    answersLog.forEach((item)=>{
        if(!item.isCorrect){
            hasWrong = true;
            html += `<div class='summary-item'>${item.q}<br><span style='color:red;font-weight:bold'>Correct: ${item.correct}</span></div>`;
        }
    });
    document.getElementById("summary-content").innerHTML = hasWrong ? html : "All correct! Well done.";
}

function restartQuiz() {
    currentIdx = 0;
    score = 0;
    answersLog = [];
    document.getElementById("result-area").classList.add("hidden");
    document.getElementById("quiz-area").classList.remove("hidden");
    prepareQuestions();
    loadQuestion();
}

prepareQuestions();
loadQuestion();
</script>

</body>

<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ MIND - PRO Panel & Quiz</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #001f3f;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #00a8ff;
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin-bottom: 10px;
            object-fit: cover;
            border: 3px solid white;
        }

        h2 { margin: 5px 0 15px 0; font-size: 24px; }
        
        /* 🔄 වෙනස් කරන ලද බටන් ස්ටයිල් එක */
        .go-to-dl-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff9f43, #ff5252);
            color: white;
            padding: 14px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(255, 82, 82, 0.4);
            transition: 0.3s;
        }
        .go-to-dl-btn:hover { transform: scale(1.05); }

        /* --- Quiz UI --- */
        .level-badge {
            background: #ffd700; color: #333;
            padding: 5px 15px; border-radius: 20px;
            font-weight: bold; display: inline-block; margin-bottom: 15px;
        }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: left; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        
        .option-btn {
            background: white; color: #333; border: none;
            padding: 14px; border-radius: 10px; font-size: 15px;
            font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s;
        }
        .option-btn:hover:not([disabled]) { background: #f0f0f0; transform: translateX(5px); }
        
        .correct { background-color: #2ed573 !important; color: white !important; }
        .wrong { background-color: #ff4757 !important; color: white !important; }

        .next-q-btn {
            background: #001f3f; color: white; border: 2px solid white;
            padding: 12px 25px; border-radius: 10px; font-size: 15px;
            font-weight: bold; cursor: pointer; margin-top: 20px; 
            display: none; width: 100%; transition: 0.2s;
        }
        .next-q-btn:hover { background: white; color: #001f3f; }
        
        .result-screen { display: none; }
        .next-round-btn {
            background: #ff4b2b; color: white; border: none;
            padding: 12px 25px; border-radius: 10px; font-size: 16px;
            font-weight: bold; cursor: pointer; margin-top: 20px; display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="IQ MIND Logo" class="logo-img">
        <h2>👑 PRO MATERIALS</h2>
        <a href="download-page.html" class="go-to-dl-btn">
            📄 PDF බාගත කරගන්න මෙතනින් යන්න ➡️
        </a>
    </div>

    <div class="container" id="quizContainer">
        <div id="quizPlayScreen">
            <span class="level-badge" id="levelInfo">ROUND 1/10 (PACK 1)</span>
            <p id="qNumber" style="text-align: left; font-weight: bold; margin: 0; color: #ffd700;">Question 1 of 10</p>
            <p class="question-text" id="questionText">ප්‍රශ්නය මෙතනට...</p>
            
            <div class="options-container">
                <button class="option-btn" onclick="checkAnswer(0, this)" id="opt0">පිළිතුර 1</button>
                <button class="option-btn" onclick="checkAnswer(1, this)" id="opt1">පිළිතුර 2</button>
                <button class="option-btn" onclick="checkAnswer(2, this)" id="opt2">පිළිතුර 3</button>
                <button class="option-btn" onclick="checkAnswer(3, this)" id="opt3">පිළිතුර 4</button>
            </div>

            <button class="next-q-btn" id="nextQBtn" onclick="goToNextQuestion()">NEXT QUESTION ➡️</button>
        </div>

        <div id="quizResultScreen" class="result-screen">
            <h2 id="resultTitle">Round Completed!</h2>
            <p id="resultScore" style="font-size: 20px; font-weight: bold;"></p>
            <p id="resultMsg"></p>
            <button class="next-round-btn" id="nextRoundBtn" onclick="startNextRound()">NEXT ROUND</button>
        </div>
    </div>

<script>
    // (ප්‍රශ්න සහ ඉතිරි JavaScript කෝඩ් එක කලින් එකමයි...)
    const allQuestions = [
        { q: "ලංකාවේ අගනගරය කුමක්ද?", app: ["කොළඹ", "ශ්‍රී ජයවර්ධනපුර කෝට්ටේ", "මහනුවර", "ගාල්ල"], ans: 1 },
        { q: "පෘථිවියට ඇති එකම ස්වාභාවික උපග්‍රහයා කවුද?", app: ["සූර්යයා", "අඟහරු", "චන්ද්‍රයා", "බ්‍රහස්පති"], ans: 2 },
        { q: "IQ ප්‍රශ්නය: 2, 4, 6, 8, ... ඊළඟ අංකය කුමක්ද?", app: ["9", "10", "12", "14"], ans: 1 },
        { q: "श්‍රී ලංකාවේ දිගම ගඟ කුමක්ද?", app: ["කැළණි ගඟ", "වලවේ ගඟ", "මහවැලි ගඟ", "කළු ගඟ"], ans: 2 },
        { q: "සූර්යග්‍රහණයක් සිදුවන්නේ කුමන දිනකද?", app: ["පසළොස්වක පෝය දින", "අමාවක දින", "අටවක දින", "ඕනෑම දිනක"], ans: 1 },
        { q: "මිනිස් සිරුරේ ඇති විශාලම ඉන්ද්‍රිය කුමක්ද?", app: ["අක්මාව", "පෙනහළු", "සම", "හෘදයවස්තුව"], ans: 2 },
        { q: "ලෝකයේ විශාලම සාගරය කුමක්ද?", app: ["ඉන්දියන් සාගරය", "ඇට්ලන්ටික් සාගරය", "පැසිෆික් සාගරය", "ආක්ටික් සාගරය"], ans: 2 },
        { q: "ජලයේ රසායනික සංකේතය කුමක්ද?", app: ["CO2", "H2O", "O2", "NaCl"], ans: 1 },
        { q: "පරිගණකයේ මොළය ලෙස හඳුන්වන්නේ කුමක්ද?", app: ["RAM", "Hard Disk", "CPU", "Monitor"], ans: 2 },
        { q: "ශ්‍රී ලංකාවේ ජාතික පුෂ්පය කුමක්ද?", app: ["නෙළුම්", "මානෙල්", "ඕලු", "සමන්පිච්ච"], ans: 1 }
    ];

    let currentRound = 1;      
    let currentQIndex = 0;     
    let roundScore = 0;        

    function loadQuestion() {
        document.getElementById("quizPlayScreen").style.display = "block";
        document.getElementById("quizResultScreen").style.display = "none";
        document.getElementById("nextQBtn").style.display = "none";

        let globalIndex = ((currentRound - 1) * 10) + currentQIndex;
        let qData = allQuestions[globalIndex];

        if(!qData) return;

        document.getElementById("levelInfo").innerText = `ROUND ${currentRound}/10 (PACK ${currentRound})`;
        document.getElementById("qNumber").innerText = `Question ${currentQIndex + 1} of 10`;
        document.getElementById("questionText").innerText = qData.q;
        
        for (let i = 0; i < 4; i++) {
            let btn = document.getElementById(`opt${i}`);
            btn.innerText = qData.app[i];
            btn.className = "option-btn";
            btn.disabled = false;
        }
    }

    function checkAnswer(selectedOpt, clickedBtn) {
        let globalIndex = ((currentRound - 1) * 10) + currentQIndex;
        let correctAns = allQuestions[globalIndex].ans;

        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).disabled = true;
        }

        if (selectedOpt === correctAns) {
            clickedBtn.classList.add("correct");
            roundScore++;
        } else {
            clickedBtn.classList.add("wrong");
            document.getElementById(`opt${correctAns}`).classList.add("correct");

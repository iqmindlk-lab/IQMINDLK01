<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ MIND PRO - Papers & Notes</title>
    
    <script>
      (function() {
        const userSession = sessionStorage.getItem("iq_user_id");
        // session එකක් නැත්නම් කෙලින්ම index.html එකට යවන්න
        if (!userSession) {
          window.location.href = "proiqmind.html";
        }
      })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ඔබගේ පවතින CSS මෙහි ඉතිරි කොටස පවතී... */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            background-color: #06031f;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }
        /* (ඉතිරි CSS කලින් තිබූ පරිදිම තබාගන්න) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0,168,255,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(255,65,108,0.10) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        /* ඉතිරි කොටස් කලින් තිබූ පරිදිම භාවිතා කරන්න */
    </style>
</head>
<body>

<div class="container">
    <a href="propage.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> ආපසු යන්න
    </a>

    <div class="header">
        <span class="header-icon">📄</span>
        <div class="brand-title">පේපර් PDF</div>
        <div class="brand-sub">ඔබට අවශ්‍ය category එක select කරන්න</div>
    </div>

    <div class="section-label">categories</div>

    <div class="buttons-grid">
        <a href="past-papers.html" class="cat-btn past-btn">
            <div class="pulse-ring"></div>
            <div class="btn-icon-wrap">
                <i class="fas fa-history"></i>
            </div>
            <div class="btn-text">
                <span class="btn-title">PAST PAPERS</span>
                <span class="btn-desc">පසුගිය විභාග ප්‍රශ්න පත්‍ර · PDF Download</span>
            </div>
            <i class="fas fa-chevron-right btn-arrow"></i>
        </a>
        </div>
</div>

</body>
